# MOCRE static vhost.
# Root is the release's public/ directory, never the full project tree.

server {
    listen 80;
    listen [::]:80;
    server_name mocre.es www.mocre.es;

    root /var/www/html/mocre/current/public;
    index index.html;
    autoindex off;

    access_log /var/log/nginx/mocre.access.log;
    error_log  /var/log/nginx/mocre.error.log warn;

    limit_req zone=general burst=60 nodelay;
    limit_conn conn_per_ip 30;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    # HSTS: this is emitted on TLS (443) responses. When certbot --nginx promotes this vhost to
    # 443 it must carry this header (the 443 server block is created/managed on the host by certbot);
    # verify with:  curl -sI https://mocre.es/ | grep -i strict-transport-security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # NOTE (Cloudflare origin lock): if the origin IP is reachable directly, Cloudflare's
    # WAF/rate-limit can be bypassed by resolving mocre.es to the origin. On a shared host, the
    # correct fix is either (a) a host firewall allowing 80/443 only from
    # Cloudflare's published ranges (affects ALL sites — only if every vhost is CF-proxied), or
    # (b) Cloudflare Authenticated Origin Pulls (account-level). Decide per-host; do not blanket
    # -firewall a shared origin without confirming every sibling site is behind Cloudflare.

    location = /map {
        return 301 /map/;
    }

    location = /globe {
        return 301 /globe/;
    }

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ^~ /auth/ {
        add_header Retry-After "3600" always;
        return 503;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~* \.(?:php|phtml|php3|php4|php5|php7|phar|cgi|pl)(?:/|$) {
        return 404;
    }

    location ~* \.(?:bak|backup|conf|config|dist|env|ini|key|log|md|old|orig|pem|save|sh|sql|sqlite|sqlite3|swp|tmp|toml|ya?ml|zip|tar|tgz|gz|bz2|7z|rar)$ {
        return 404;
    }

    location ~* \.(?:png|ico|svg)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.json$ {
        expires 5m;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
